<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enzyme Map</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body>
    <div class="wrapper">
        <div class="form-header">
            <h1>Enzyme Sequence Mapper</h1>
            <p>Enter a DNA sequence, or select from other options, to identify cut sites. Once you submit a sequence, you may choose to customize your analysis.</p>
        </div>
        <form action="/analyse_sequence" method="POST" enctype="multipart/form-data">
            <div class="error">
                {{ error }}
            </div>
            <div class="tab-header">
                <button type="button" class="tab-btn active" data-target="text">Sequence Input</button>
                <button type="button" class="tab-btn" data-target="file">File Input</button>
                <button type="button" class="tab-btn" data-target="genbank">Genbank Input</button>
            </div>
            <div id="text" class="tab-content active">
                <label for="textarea">Type or paste a sequence</label>
                <textarea id=textarea name="sequence" rows="5" cols="40" placeholder="ACGT..."></textarea>
            </div>

            <div id="file" class="tab-content">
                <label for="file">Upload a FASTA or plain-text sequence file.</label>
                <input type="file" name="file" id="file" accept=".fasta,.fa,.txt">
            </div>

            <div id="genbank" class="tab-content">
                <label for="genbank">Fetches the sequence from NCBI by accession.</label>
                <input type="text" name="accession" id="genbank" placeholder="e.g. NC_005816">
            </div>

            <div class="settings">
                <h3>Settings</h3>
                <div class="setting-row">
                    <input type="checkbox" name="circular" id="circular">
                    <label for="circular">Sequence is circular</label>
                </div>

                <div class="setting-row">
                    <label for="region_start">Process only from:</label>
                    <input type="number" name="region_start" min="1" id="region_start">
                    <label for="region_end">to:</label>
                    <input type="number" name="region_end" min="1" id="region_end">
                    <label for="region_end">bp</label>
                </div>

                <div class="setting-row">
                    <label for="max_cuts">Only show enzymes that cut at most:</label>
                    <input type="number" name="max_cuts" min="1" id="max_cuts">
                    <label for="max_cuts">times</label>
                </div>
            </div>

            <input type="hidden" name="method" id="method" value="text">
            <button type="submit" class="submit-btn">Start Analysis</button>
        </form>
    </div>

<script src="/static/js/main.js"></script>
</body>
</html>
